services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image-processing-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/image_processing
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: image-processing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: image_processing
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: